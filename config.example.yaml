manager:
  bind: 0.0.0.0
  host: 127.0.0.1
  port: 8443
  # password_hash via KIOSK_PASSWORD_HASH (or set here)
  oidc:
    issuer: https://auth.example.com
    client_id: kiosk-display
    # client_secret via KIOSK_OIDC_CLIENT_SECRET (or set here)
    redirect_url: https://127.0.0.1:8443/api/oidc/callback
    post_logout_redirect_url: https://127.0.0.1:8443/
    scopes: [openid, profile, email, groups]
    required_groups: [kiosk-display-access]
    auto_redirect: true
display:
  port: 8081
  sleep:
    - [xset, dpms, force, off]
  wake:
    - [xset, dpms, force, on]
    - [xset, -dpms]
chrome:
  path: /usr/bin/chromium
  display: ":0"
  width: 1920
  height: 1080
  restart: 2s
links:
  - label: Example
    url: https://example.com/
  - label: Google
    url: https://www.google.com/
allow_edit_links: false
allowed_hosts:
  - example.com
  - www.google.com
auto_allow_link_hosts: false
auto_allow_subdomains: false
