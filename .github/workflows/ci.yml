name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: Tech-S1/ci-templates/.github/workflows/go-ci.yml@main
    with:
      build-packages: ./cmd/kiosk-display
