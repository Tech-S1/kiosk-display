name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "renovate.json"
  pull_request:
    paths-ignore:
      - "README.md"
      - "renovate.json"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: Tech-S1/ci-templates/.github/workflows/go-ci.yml@main
    with:
      build-packages: ./cmd/kiosk-display
